<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandLogic - Rock Paper Scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button 
        onclick="
        pickComputerMove();
        let result = '';
        if (computerMove === 'Rock') 
            {
                result = 'Tie';
            } 
        else if (computerMove === 'Paper') 
            {
                result = 'You lose. ';
            } 
        else if (computerMove === 'Scissors')
            {
                result = 'You win. ';
            }
        else
            {
                result = 'Computer Error.'
            }    
        alert(`You picked rock. Computer picked ${computerMove}. ${result}`);
    "
    >
    Rock</button>
    <button 
        onclick = "
            pickComputerMove();
            let result1 = '';
            if (computerMove === 'Rock') 
                {
                    result1 = 'You win.';
                } 
            else if (computerMove === 'Paper')
                {
                result1 = 'Tie';
                } 
            else if (computerMove === 'Scissors')
                {
                    result1 = 'You lose. ';
                }
            else 
                {
                    result1 = 'Computer error.';
                }

            alert(`You picked paper. Computer picked ${computerMove}. ${result1}`);">Paper</button>
    <button 
        onclick = "
            pickComputerMove();
            let result2 = '';
            if (computerMove === 'Rock')
                {
                    result2 = 'You lose.';
                } 
            else if (computerMove === 'Paper')
                {
                    result2 = 'You win.. ';
                } 
            else if (computerMove === 'Scissors')
                {
                    result2 = 'Tie';
                }

            alert(`You picked scissors. Computer picked ${computerMove}. ${result2}`);">Scissors</button>
    <script>
        let computerMove = '';
        function pickComputerMove(){
            const randomNumber = Math.random();
            if (randomNumber >= 0 && randomNumber < 1/3)
                {
                    computerMove = 'Rock';
                } 
            else if (randomNumber >= 1/3 && randomNumber < 2/3)
                {
                    computerMove = 'Paper';
                }
            else if (randomNumber >= 2/3 && randomNumber < 1)
                {
                    computerMove = 'Scissors';
                } 
            else 
                {
                computerMove = 'Invalid choice';
                }
        
            console.log(computerMove);
        }
    </script>
</body>
</html>
